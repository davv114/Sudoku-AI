<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test · Sudoku Vision</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 34px 18px 60px;
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
      color: #e8eefb;
      background:
        radial-gradient(800px 500px at 10% -10%, rgba(99, 102, 241, .25), transparent 60%),
        radial-gradient(700px 500px at 100% 0%, rgba(34, 211, 238, .14), transparent 55%),
        #070b16;
    }
    main { width: min(760px, 100%); margin: 0 auto; }
    a { color: #a5b4fc; }
    h1 { margin: 0 0 4px; font-size: 1.5rem; letter-spacing: -.02em; }
    .subtitle { margin: 0 0 22px; color: #94a3b8; font-size: .85rem; line-height: 1.6; }
    .summary {
      display: inline-flex;
      margin-bottom: 18px;
      padding: 8px 14px;
      border: 1px solid rgba(148, 163, 184, .25);
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 700;
      color: #94a3b8;
    }
    .summary--ok { color: #a7f3d0; border-color: rgba(52, 211, 153, .4); background: rgba(6, 78, 59, .25); }
    .summary--fail { color: #fecdd3; border-color: rgba(251, 113, 133, .4); background: rgba(127, 29, 29, .25); }
    #results { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .test {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 14px;
      border: 1px solid rgba(148, 163, 184, .16);
      border-radius: 13px;
      background: rgba(15, 23, 42, .72);
      animation: in .25s ease both;
    }
    .test--pass { border-left: 3px solid #34d399; }
    .test--fail { border-left: 3px solid #fb7185; background: rgba(127, 29, 29, .16); }
    .test-badge {
      flex: none;
      min-width: 47px;
      padding: 3px 7px;
      border-radius: 6px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: .62rem;
      font-weight: 800;
      text-align: center;
      color: #052e16;
      background: #34d399;
    }
    .test--fail .test-badge { background: #fb7185; color: #450a0a; }
    .test strong { display: block; font-size: .83rem; font-weight: 650; }
    .test p { margin: 3px 0 0; color: #94a3b8; font-size: .73rem; line-height: 1.45; }
    .test--fail p { color: #fda4af; }
    footer { margin-top: 26px; color: #64748b; font-size: .75rem; }
    @keyframes in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Test del motore Sudoku</h1>
    <p class="subtitle">
      Verifica solutore, suggerimenti progressivi, validazione e omografia dell'overlay.
      I test girano interamente nel browser, senza chiamate API.
    </p>
    <div class="summary" id="summary">Esecuzione in corso…</div>
    <ol id="results"></ol>
    <footer>
      <a href="./index.html">← Torna all'applicazione</a> ·
      Apri questa pagina con <code>py -3 server.py</code> su
      <code>http://localhost:8765/tests.html</code>.
    </footer>
  </main>
  <script type="module" src="assets/js/tests.js"></script>
</body>
</html>
